<main class="signup-page-container">
  <!-- Decorative background elements -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="glow-orb orb-3"></div>

  <div class="signup-card">
    <div class="card-header">
      <div class="brand-badge">
        <span class="badge-icon">🥛</span>
        <span>Pratik Dairy & Sweets</span>
      </div>
      <h1>Create Your Account</h1>
      <p>Sign up to get fresh dairy products & traditional sweets delivered directly to your doorstep.</p>
    </div>

    <form (ngSubmit)="onSubmit()" #signupForm="ngForm" class="signup-form">
      <!-- 3-Column Names -->
      <div class="form-grid grid-3">
        <div class="input-group">
          <label for="firstName">First Name <span class="req">*</span></label>
          <input
            type="text"
            id="firstName"
            name="firstName"
            placeholder="John"
            [(ngModel)]="user.firstName"
            required
            #firstNameField="ngModel"
            [class.is-invalid]="firstNameField.invalid && (firstNameField.dirty || firstNameField.touched)"
          />
          <div *ngIf="firstNameField.invalid && (firstNameField.dirty || firstNameField.touched)" class="error-text">
            Required
          </div>
        </div>

        <div class="input-group">
          <label for="middleName">Middle Name</label>
          <input
            type="text"
            id="middleName"
            name="middleName"
            placeholder="Kumar"
            [(ngModel)]="user.middleName"
          />
        </div>

        <div class="input-group">
          <label for="lastName">Last Name <span class="req">*</span></label>
          <input
            type="text"
            id="lastName"
            name="lastName"
            placeholder="Doe"
            [(ngModel)]="user.lastName"
            required
            #lastNameField="ngModel"
            [class.is-invalid]="lastNameField.invalid && (lastNameField.dirty || lastNameField.touched)"
          />
          <div *ngIf="lastNameField.invalid && (lastNameField.dirty || lastNameField.touched)" class="error-text">
            Required
          </div>
        </div>
      </div>

      <!-- 2-Column Username & Phone -->
      <div class="form-grid grid-2">
        <div class="input-group">
          <label for="username">Username <span class="req">*</span></label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="johndoe"
            [(ngModel)]="user.username"
            required
            #usernameField="ngModel"
            [class.is-invalid]="usernameField.invalid && (usernameField.dirty || usernameField.touched)"
          />
          <div *ngIf="usernameField.invalid && (usernameField.dirty || usernameField.touched)" class="error-text">
            Username required
          </div>
        </div>

        <div class="input-group">
          <label for="phoneNumber">Phone Number</label>
          <input
            type="tel"
            id="phoneNumber"
            name="phoneNumber"
            [(ngModel)]="user.phoneNumber"
            placeholder="9876543210"
          />
        </div>
      </div>

      <!-- Email Address -->
      <div class="input-group">
        <label for="email">Email Address <span class="req">*</span></label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="john@example.com"
          [(ngModel)]="user.email"
          required
          email
          #emailField="ngModel"
          [class.is-invalid]="emailField.invalid && (emailField.dirty || emailField.touched)"
        />
        <div *ngIf="emailField.invalid && (emailField.dirty || emailField.touched)" class="error-text">
          Enter a valid email address
        </div>
      </div>

      <!-- 2-Column Passwords -->
      <div class="form-grid grid-2">
        <div class="input-group">
          <label for="password">Password <span class="req">*</span></label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Min 8 characters"
            [(ngModel)]="user.password"
            required
            minlength="8"
            #passwordField="ngModel"
            [class.is-invalid]="passwordField.invalid && (passwordField.dirty || passwordField.touched)"
          />
          <div *ngIf="passwordField.invalid && (passwordField.dirty || passwordField.touched)" class="error-text">
            Min 8 characters
          </div>
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirm Password <span class="req">*</span></label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Re-enter password"
            [(ngModel)]="user.confirmPassword"
            required
            #confirmPasswordField="ngModel"
            [class.is-invalid]="passwordMismatch && (signupForm.submitted || confirmPasswordField.touched)"
          />
          <div *ngIf="passwordMismatch" class="error-text">
            Passwords do not match
          </div>
        </div>
      </div>

      <!-- Action Button -->
      <button type="submit" [disabled]="!signupForm.valid" class="btn-submit">
        <span>Complete Registration</span>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>

      <div class="login-footer">
        Already have an account? <a routerLink="/login">Sign in</a>
      </div>
    </form>
  </div>
</main>
