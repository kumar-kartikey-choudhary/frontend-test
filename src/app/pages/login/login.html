<main class="auth-page-container">
  <!-- Decorative ambient light orbs -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="glow-orb orb-3"></div>

  <div class="auth-panel-wrapper">
    <div class="auth-panel">
      <div class="brand-header">
        <div class="logo-container">
          <img src="assets/images/pratik-dairy-logo.png" alt="Pratik Dairy Logo" class="logo-img" />
        </div>
        <h2>Welcome Back!</h2>
        <p class="intro-text">Please sign in to access your dashboard and place orders.</p>
      </div>

      <form class="auth-form" (ngSubmit)="onLogin()">
        <div class="input-group">
          <label for="username">Username / Email</label>
          <input
            type="text"
            id="username"
            placeholder="Enter your username or email"
            [(ngModel)]="loginForm.username"
            name="username"
            required
          />
        </div>

        <div class="input-group">
          <div class="password-header">
            <label for="password">Password</label>
            <a routerLink="/forgot-password" class="forgot-link">Forgot Password?</a>
          </div>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            [(ngModel)]="loginForm.password"
            name="password"
            required
          />
        </div>

        <button type="submit" class="btn-submit">
          <span>Log In Securely</span>
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>
      </form>

      <div class="switch-cta">
        <p>New to Pratik Dairy & Sweets?</p>
        <a routerLink="/signup" class="switch-link">Create an Account</a>
      </div>
    </div>
  </div>
</main>
