@if (total() > 0) {
  <nav class="pager" aria-label="Pagination">
    <label class="page-size">
      Rows
      <select class="size" [value]="pageSize()" (change)="onSize($event)">
        @for (n of pageSizes(); track n) {
          <option [value]="n" [selected]="n === pageSize()">{{ n }}</option>
        }
      </select>
    </label>

    <span class="pager-info" role="status">
      Showing {{ from() }}–{{ to() }} of {{ total() }}
      @if (pageCount() > 1) { · Page {{ page() }} of {{ pageCount() }} }
    </span>

    <div class="pager-buttons">
      <button type="button" class="pg-btn" [disabled]="page() <= 1" (click)="pageChange.emit(page() - 1)">Previous</button>
      <button type="button" class="pg-btn" [disabled]="page() >= pageCount()" (click)="pageChange.emit(page() + 1)">Next</button>
    </div>
  </nav>
}
